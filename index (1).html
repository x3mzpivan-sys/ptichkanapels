
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ptichka Napela</title>
<style>
body{margin:0;background:#10151d;color:#eef4ff;font-family:Arial,sans-serif;padding:20px}
main{max-width:650px;margin:35px auto;background:#1b2432;padding:24px;border-radius:20px}
h1{color:#70e1b0}p{color:#c2ccda;line-height:1.5}
button,input{width:100%;box-sizing:border-box;margin:12px 0;padding:14px;border-radius:10px}
button{background:#70e1b0;border:0;font-weight:bold;font-size:16px}
progress{width:100%;height:22px}
#result{overflow-wrap:anywhere;white-space:pre-wrap}
</style>
</head>
<body>
<main>
<h1>🐦 Ptichka Napela</h1>
<p>Проверка файла: размер до 1 ГБ. Вычисление SHA-256 в браузере.</p>
<input id="file" type="file">
<button id="start">Проверить файл</button>
<progress id="bar" value="0" max="100"></progress>
<p id="status">Ожидаю файл…</p>
<p id="result"></p>
<p>Важно: SHA-256 помогает идентифицировать файл, но сам по себе не обнаруживает вирусы.</p>
</main>
<script>
const input=document.getElementById('file');
const bar=document.getElementById('bar');
const status=document.getElementById('status');
const result=document.getElementById('result');
const MAX=1024*1024*1024;
const CHUNK=2*1024*1024;

function hex(buffer){
 return Array.from(new Uint8Array(buffer))
 .map(b=>b.toString(16).padStart(2,'0')).join('');
}

document.getElementById('start').onclick=async()=>{
 const f=input.files[0];
 result.textContent='';
 bar.value=0;
 if(!f){status.textContent='Сначала выбери файл.';return;}
 if(f.size>MAX){status.textContent='Файл больше 1 ГБ.';return;}
 if(!crypto.subtle){status.textContent='SHA-256 недоступен. Открой сайт через HTTPS.';return;}
 try{
  const parts=[];
  for(let pos=0;pos<f.size;pos+=CHUNK){
   const data=await f.slice(pos,Math.min(pos+CHUNK,f.size)).arrayBuffer();
   parts.push(new Uint8Array(data));
   const done=Math.min(pos+CHUNK,f.size);
   bar.value=f.size?done/f.size*100:100;
   status.textContent=`Обработано ${(done/1048576).toFixed(2)} из ${(f.size/1048576).toFixed(2)} МБ (${bar.value.toFixed(1)}%)`;
   await new Promise(r=>setTimeout(r,0));
  }
  const all=new Uint8Array(f.size);
  let offset=0;
  for(const p of parts){all.set(p,offset);offset+=p.length;}
  const digest=await crypto.subtle.digest('SHA-256',all);
  result.textContent='Файл: '+f.name+'\nРазмер: '+f.size+' байт\nSHA-256: '+hex(digest);
  status.textContent='Хеш вычислен. Это не означает, что файл безопасен.';
  bar.value=100;
 }catch(e){status.textContent='Ошибка: '+e.message;}
};
</script>
</body>
</html>
